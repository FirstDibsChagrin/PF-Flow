<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>PF Flow</title>
    <script>
      // /?repair: drop the offline app cache (keeps all flow data), then reload fresh.
      if (/[?&]repair/.test(location.search)) {
        window.__pfRepairing = true;
        (async function () {
          try {
            var regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            var keys = window.caches ? await caches.keys() : [];
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          } catch (e) {}
          location.replace('/');
        })();
      }
      try {
        var t = localStorage.getItem('pf.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort message if the app's code never starts (e.g. a stale offline cache).
      setTimeout(function () {
        var r = document.getElementById('root');
        if (window.__pfStarted || window.__pfRepairing || !r || r.children.length) return;
        r.innerHTML =
          '<div style="max-width:560px;margin:15vh auto;padding:24px;font:14px system-ui,sans-serif;color:#9aa0ad">' +
          '<div style="font-size:18px;font-weight:600;color:inherit;filter:brightness(1.5);margin-bottom:8px">PF Flow didn\'t start</div>' +
          'This is usually an outdated offline copy of the app. Your flows are safe.<br><br>' +
          '<a href="/?repair" style="color:#818cf8">Repair and reload</a></div>';
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
